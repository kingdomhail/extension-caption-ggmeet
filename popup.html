<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captions Recorder for Google Meet</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">CC</div>
        <div class="brand-text">
          <h1>Meet Captions</h1>
          <span id="roomBadge" class="room-badge">Đang kiểm tra phòng...</span>
        </div>
      </div>
      <span id="lineCount" class="count-pill">0 dòng</span>
    </header>

    <section class="status-bar" aria-live="polite">
      <div class="status-indicator">
        <span id="statusDot" class="status-dot idle"></span>
        <span id="statusText" class="status-text">Chưa bật phụ đề</span>
      </div>
      <span id="statusHint" class="status-hint"></span>
    </section>

    <main class="preview-wrapper">
      <div class="preview-header">
        <span>Xem trước phụ đề mới nhất</span>
        <span id="autoScrollHint" class="preview-sub">Thời gian thực</span>
      </div>

      <div id="captionList" class="caption-list" role="log" aria-live="polite">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon" aria-hidden="true">💬</div>
          <p class="empty-title">Chưa có phụ đề nào được ghi</p>
          <p class="empty-desc">
            Hãy vào phòng họp Google Meet và bật nút <strong>Phụ đề (CC)</strong> để tự động thu thập nội dung.
          </p>
        </div>
      </div>
    </main>

    <footer class="actions">
      <button id="copyBtn" class="btn btn-primary" type="button" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copyBtnLabel">Copy toàn bộ</span>
      </button>

      <div class="actions-secondary">
        <button id="downloadBtn" class="btn btn-secondary" type="button" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Tải file .txt</span>
        </button>

        <button id="clearBtn" class="btn btn-danger" type="button" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
          </svg>
          <span id="clearBtnLabel">Xóa dữ liệu</span>
        </button>
      </div>
    </footer>

    <div class="copyright">© 2026 Hải Lập Trình</div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

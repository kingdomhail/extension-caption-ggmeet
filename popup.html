<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captions Recorder for Google Meet</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">CC</div>
        <div class="brand-text">
          <h1>Meet Captions</h1>
          <span id="roomBadge" class="room-badge">Checking meeting room...</span>
        </div>
      </div>
      <span id="lineCount" class="count-pill">0 lines</span>
    </header>

    <section class="status-bar" aria-live="polite">
      <div class="status-indicator">
        <span id="statusDot" class="status-dot idle"></span>
        <span id="statusText" class="status-text">Captions Off</span>
      </div>
      <span id="statusHint" class="status-hint"></span>
    </section>

    <label class="mute-row" for="keepMutedToggle">
      <span class="mute-copy">
        <span class="mute-title">Keep mic muted</span>
        <span class="mute-hint">Turns the microphone off if it opens</span>
      </span>
      <input id="keepMutedToggle" type="checkbox" role="switch" aria-label="Keep mic muted">
    </label>

    <div class="tabs" role="tablist" aria-label="Meeting details">
      <button id="tabCaptions" class="tab" type="button" role="tab" aria-selected="true" aria-controls="captionList">Captions</button>
      <button id="tabPeople" class="tab" type="button" role="tab" aria-selected="false" aria-controls="captionList">People</button>
      <button id="tabChat" class="tab" type="button" role="tab" aria-selected="false" aria-controls="captionList">Chat</button>
    </div>

    <main class="preview-wrapper">
      <div class="preview-header">
        <span id="previewTitle">Latest Captions Preview</span>
        <span id="autoScrollHint" class="preview-sub">Real-time</span>
      </div>

      <div id="captionList" class="caption-list" role="log" aria-live="polite">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon" aria-hidden="true">💬</div>
          <p id="emptyTitle" class="empty-title">No captions recorded yet</p>
          <p id="emptyDesc" class="empty-desc">
            Join a Google Meet call and turn on Captions (CC) to start recording automatically.
          </p>
        </div>
      </div>
    </main>

    <footer class="actions">
      <button id="copyBtn" class="btn btn-primary" type="button" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copyBtnLabel">Copy All</span>
      </button>

      <div class="actions-secondary">
        <button id="downloadBtn" class="btn btn-secondary" type="button" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download .txt</span>
        </button>

        <button id="clearBtn" class="btn btn-danger" type="button" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
          </svg>
          <span id="clearBtnLabel">Clear Data</span>
        </button>
      </div>
    </footer>

    <footer id="peopleActions" class="actions" hidden>
      <div class="actions-secondary actions-three">
        <button id="peoplePdfBtn" class="btn btn-secondary" type="button" disabled>PDF</button>
        <button id="peopleExcelBtn" class="btn btn-secondary" type="button" disabled>Excel</button>
        <button id="peoplePngBtn" class="btn btn-secondary" type="button" disabled>PNG</button>
      </div>
    </footer>

    <footer id="chatActions" class="actions" hidden>
      <button id="chatTxtBtn" class="btn btn-primary" type="button" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download .txt</span>
      </button>
    </footer>

    <div class="copyright">© 2026 Hải Lập Trình</div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
